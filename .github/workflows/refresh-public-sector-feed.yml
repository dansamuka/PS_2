name: Refresh public-sector feed

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Refresh feed
        run: python3 scripts/refresh_public_sector_feed.py
      - name: Validate feed
        run: python3 scripts/validate_public_sector_feed.py data/public_sector_feed.json --registry data/source_registry.json
      - name: Sync root feed
        run: cp data/public_sector_feed.json public_sector_feed.json
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/public_sector_feed.json public_sector_feed.json data/last_run_report.json
          git diff --cached --quiet || git commit -m "Refresh public-sector feed"
          git push
