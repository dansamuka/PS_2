name: Refresh public sector feed

on:
  workflow_dispatch:
  schedule:
    - cron: '30 4 * * *'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Refresh Phase 3E reviewed-promotion feed
        run: python3 scripts/refresh_public_sector_feed.py --collect-central --out data/public_sector_feed.json --root-out public_sector_feed.json
      - name: Validate feed
        run: python3 scripts/validate_public_sector_feed.py data/public_sector_feed.json --registry data/source_registry.json
      - name: Verify Phase 3 scope
        run: python3 scripts/verify_phase3.py
      - name: Verify Phase 3B latest-role ingestion
        run: python3 scripts/verify_phase3b.py
      - name: Verify Phase 3C role identity reconciliation
        run: python3 scripts/verify_phase3c.py
      - name: Verify Phase 3D discovery promotion workbench
        run: python3 scripts/verify_phase3d.py
      - name: Verify Phase 3E reviewed-promotion importer
        run: python3 scripts/verify_phase3e.py
      - name: KSG collector import smoke test
        run: python3 -c "from scripts.collectors import ksg; print('ksg import ok')"
      - name: Run collector parser tests
        run: python3 -m pytest -q scripts/tests || echo "pytest unavailable or parser tests skipped in workflow"
      - name: Commit updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data public_sector_feed.json
          git diff --cached --quiet || git commit -m "Refresh reviewed-promotion public-sector roles"
          git push
